<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
  </defs>

  <!-- Background rounded squircle -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" />

  <!-- Back document shadow/hint -->
  <rect x="20" y="10" width="28" height="34" rx="4" fill="#ffffff" opacity="0.35" />

  <!-- Front document -->
  <rect x="14" y="15" width="30" height="36" rx="4" fill="#ffffff" />
  
  <!-- Document lines -->
  <line x1="20" y1="23" x2="38" y2="23" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" />
  <line x1="20" y1="29" x2="34" y2="29" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" />
  <line x1="20" y1="35" x2="38" y2="35" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" />

  <!-- PDF Badge in bottom right -->
  <rect x="24" y="38" width="34" height="18" rx="5" fill="url(#badgeGrad)" stroke="#ffffff" stroke-width="1.5" />
  <text x="41" y="51" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="10.5" text-anchor="middle" letter-spacing="0.5">PDF</text>
</svg>
